<script>
function dataTranscoder() {
var result=[];
d3.json("/json/chrg_data.json", function(data) {

let all_links = _.uniqWith(data.links,_.isEqual);
let grp_sources1 = _.groupBy(all_links,"source");
let grp_sources2 = _.groupBy(all_links,"target");

//Combined groups to closely match the d3 graphing part..
let all_groups =_.merge(grp_sources1,grp_sources2);
let final_range=[]; let i=0;
_.forEach(all_groups, (grouping) => {
let chargers_group = "abcdefghijklmnop".substr(0,grouping.length); //From all 16 elements, select/combine etc. -> permutations/combinations etc.
let combs = new Combinatorics.Permutation(chargers_group,2);
let final_data = {};

let allKeys = Object.keys(all_groups); //Add per index in the obj.
let objGroupId = _.get(_.find(data.nodes,(o) => o.name == allKeys[i]),'grp'); //Retrive the appropriate Id/city, per iteration

  _.set(grouping,['total_targets'], grouping.length);
  _.set(grouping,['total_combos'], parseInt(combs.length));
  
  //Transform add data to new table object with range..
  _.assignIn(final_data,{"cityId":(objGroupId === 1 ? "N": objGroupId === 2 ?"L": objGroupId === 4 ? "A.N." : objGroupId === 3 ? "P":"")},{"chargerName":allKeys[i]},_.pick(grouping,'total_targets'),_.pick(grouping,'total_combos'));
  result.push(final_data);
  i++;
  });
});
return  result;
}
var tbl_update = dataTranscoder(); var total = 0;

window.addEventListener("load", (event) => {
// Continue with html table update as below..
var main_tbl_body = document.querySelector('#data_main > table > tbody');
tbl_update.forEach( (row) => {
total += row.total_combos;
//Generate,append  template-fragment to table body/ resulting row:
const template = document.createElement("template");
template.innerHTML =`<tr>
      <td id="city" scope="row"></td>
      <td id="targets"></td>
      <td id="chargerName"></td>
      <td id="combos"></td>
    </tr>`;
    
const tbl_row  = template.content.cloneNode(true);
tbl_row.querySelector('#city').textContent = row.cityId;
tbl_row.querySelector('#targets').textContent = row.total_targets;
tbl_row.querySelector('#chargerName').textContent = row.chargerName;
tbl_row.querySelector('#combos').textContent = row.total_combos;

main_tbl_body.appendChild(tbl_row); //(template.content);

 });
 
 var tbl_foot = document.querySelector('#data_main > table > tfoot > tr > td');
 
 const footer_tmpl = document.createElement("template");
 footer_tmpl.innerHTML = `<p id="total"></p>`;
 
 const tbl_footer  = footer_tmpl.content.cloneNode(true);
 tbl_footer.querySelector('#total').textContent = `Total Set Combinations: ${total}`;

 tbl_foot.append(tbl_footer); //(footer_tmpl.content);
 
});

</script>
<!--
https://lodash.com/docs
https://www.npmjs.com/package/js-combinatorics

Basic combinatorial FORMULAE (where n=number):
==============================================
Permutations (All Outcomes) = fact(n_elem_in_set)/fact(n_elem_in_set - n_pairs)
==> in example 240 for args(16,2)

******************************************************************************
NOTE: Formula below is for Combinations that do not have recurring selections,
selections without repetition (or without repetitive selections)
******************************************************************************
Combinations (All Pairs) = fact(n_elem_in_set)/fact(n_pairs) * fact(n_elem_in_set - n_pairs)
==> in example 120 for args(16,2)
Or.. ??
Combinations (Permutations Over # of Pairs) = Permutations/n_pairs
==> in example 120 for args(16,2)
-->

<script>

  var treeChart = chargingChart().dataUrl("/json/static_data.json")
      .renderStrategy("tree")
      .initialScale(0.65)
      .initialTx(0.50)
      .depthSpacing(420)
      .legendSelector("#svg_legend")
      .colorMap({
          "N":    "#8dd3c7",
          "L":    "#ffffb3",
          "A.N.": "#bebada",
          "P":    "#fb8072"
      });


  var arcChart = chargingChart().dataUrl("https://apollogateway-xi.vercel.app/v2/evpointsData")
      .postPayload({"query":"query{data{ nodes {name n grp id } links { source target value} } }" }) 
      .renderStrategy("arc")
      .initialScale(0.65)
      .initialTx(0.50)
      .depthSpacing(420)
      .legendSelector("#svg_legend");
	  
  var activeChart  = arcChart;
  var arcContainer = document.getElementById("my_dataviz");

  
  const btnarc = document.getElementById("arcBtn");
  const btntree = document.getElementById("treeBtn");

    function switchChart(next) {
      d3.select(arcContainer).selectAll("svg").remove();  // clear chart
      d3.select("#svg_legend").selectAll("*").remove();   // clear legend
      activeChart = next;
      d3.select(arcContainer).call(activeChart);
  }

  
  btnarc.addEventListener("click", function(event) {
  if (btnarc.classList.value === "btn btn-primary active") return;
   d3.select("#treeBtn")
        .classed("active", false)
        .attr("aria-pressed", "false");
   d3.select("#arcBtn")
        .classed("active", true)
        .attr("aria-pressed", "true");
		
     switchChart(arcChart);
  }); 
  btntree.addEventListener("click", function(event) {
  if (btntree.classList.value === "btn btn-primary active") return;
   d3.select("#arcBtn")
        .classed("active", false)
        .attr("aria-pressed", "false");
   d3.select("#treeBtn")
        .classed("active", true)
        .attr("aria-pressed", "true");
		
     switchChart(treeChart);
  }); 
   // initial render on page load
  d3.select(arcContainer).call(activeChart);
</script>
